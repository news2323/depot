name: Dashboard veröffentlichen

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/seite.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  seite:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy2.outputs.page_url || steps.deploy3.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v6
      - name: Version an Skripte und Styles hängen (Browser laden nach jedem Update neu)
        run: sed -i "s/?v=dev/?v=${GITHUB_SHA::7}/g" web/index.html
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      # GitHub findet das eben hochgeladene Paket manchmal nicht sofort („No artifacts named github-pages“, seit 24.11.2026):
      # dann nach einer Pause noch zweimal versuchen
      - id: deploy
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure'
        run: sleep 30
      - id: deploy2
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
      - if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        run: sleep 60
      - id: deploy3
        if: steps.deploy.outcome == 'failure' && steps.deploy2.outcome == 'failure'
        uses: actions/deploy-pages@v5
